name: Test Self-Hosted Runner
on:
  workflow_dispatch:

env:
  AWS_ROLE_ARN: arn:aws:iam::345370630410:role/pypi-test
  AWS_REGION: us-east-1

jobs:
  start-aws-runner:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      mapping: ${{ steps.aws-start.outputs.mapping }}
      instances: ${{ steps.aws-start.outputs.instances }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Create cloud runner
        id: aws-start
        uses: omsf/start-aws-gha-runner@8523c3b2474a899636f06e6cab4829c853e107dc # v1.4.0
        with:
          aws_image_name: "Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 24.04)"
          aws_image_id: latest
          aws_instance_type: g4dn.xlarge
          aws_home_dir: /home/ubuntu
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
  self-hosted-test:
    runs-on: ${{ fromJSON(needs.start-aws-runner.outputs.instances) }} # This ensures that you only run on the instances you just provisioned
    needs:
      - start-aws-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Print disk usage
        run: "df -h"

      - name: Print Docker details
        run: "docker version || true"

      - name: Print GPU details
        run: "nvidia-smi"
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install OpenFF stack
        run: |
          pip install openff-toolkit openmm[cuda12] gufe \
          --index-url https://test.pypi.org/simple/ \
          --extra-index-url https://pypi.org/simple

      - name: Run test.py
        run: python test.py

      - name: Check Openmm
        run: python -m openmm.testInstallation

  stop-aws-runner:
    runs-on: ubuntu-latest
    permissions:
        id-token: write
        contents: read
    needs:
      - start-aws-runner
      - self-hosted-test
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Stop instances
        uses: omsf/stop-aws-gha-runner@a3d2e34cba8571eaf9b40ae00705d6b2b77402f6 # v1.0.0
        with:
          instance_mapping: ${{ needs.start-aws-runner.outputs.mapping }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
  notify_failure:
    needs: [self-hosted-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    if: always() && (needs.stop-aws-runner.result == 'failure')
    steps:
      - name: Create issue
        # Customize this to your liking, add assignees if needed
        run: 'gh issue create --title "AWS job failed to stop correctly" --body "Job failed, please check AWS for running instances." -R omsf-eco-infra/openmm-gpu-test'
        env:
          GH_TOKEN: ${{ github.token }}
